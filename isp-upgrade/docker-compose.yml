# docker-compose.yml — iCube Platform Full Stack
version: '3.9'

services:

  # ── Core API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:             production
      DATABASE_URL:         ${DATABASE_URL}
      REDIS_URL:            redis://redis:6379
      JWT_SECRET:           ${JWT_SECRET}
      AGENT_JWT_SECRET:     ${AGENT_JWT_SECRET}
      OPENAI_API_KEY:       ${OPENAI_API_KEY}
      OPENAI_MODEL:         ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_MAX_TOKENS:    ${OPENAI_MAX_TOKENS:-1024}
      OPENAI_CHAT_MAX_TOKENS: ${OPENAI_CHAT_MAX_TOKENS:-2048}
      STRIPE_SECRET_KEY:    ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      MTN_API_KEY:          ${MTN_API_KEY}
      MTN_API_SECRET:       ${MTN_API_SECRET}
      MTN_COLLECTION_URL:   ${MTN_COLLECTION_URL}
      AIRTEL_CLIENT_ID:     ${AIRTEL_CLIENT_ID}
      AIRTEL_CLIENT_SECRET: ${AIRTEL_CLIENT_SECRET}
      SMS_PROVIDER:         ${SMS_PROVIDER}
      SMS_API_KEY:          ${SMS_API_KEY}
      SMS_USERNAME:         ${SMS_USERNAME}
      SMS_SENDER_ID:        ${SMS_SENDER_ID}
      SUPERADMIN_JWT_SECRET: ${SUPERADMIN_JWT_SECRET}
      SA_SECRET:            ${SA_SECRET}
      PORT:                 3000
      WG_CONFIG_DIR:        /config/wireguard
      WG_SERVER_PUBLIC_KEY: ${WG_SERVER_PUBLIC_KEY:-}
      WG_SERVER_URL:        ${WG_SERVER_URL:-139.84.247.205}
      WG_SERVER_PORT:       51820
      VPN_L2TP_HOST:        ${VPN_L2TP_HOST:-vpn.icubeug.net}
      VPN_IPSEC_SECRET:     ${VPN_IPSEC_SECRET:-icube-ipsec-2024}
      PLATFORM_DOMAIN:      ${PLATFORM_DOMAIN:-icubeug.net}
      API_PUBLIC_HOST:      ${API_PUBLIC_HOST:-web.icubeug.net}
      EMAIL_FROM:           icube.support@icubeug.net
      EMAIL_PASSWORD:       ${EMAIL_PASSWORD}
      EMAIL_HOST:           smtp.zoho.com
      EMAIL_PORT:           465
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./config/wireguard:/config/wireguard
    networks:
      - isp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       isp_db
      POSTGRES_USER:     isp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_user -d isp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isp-network

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 100
    volumes:
      - redisdata:/data
    networks:
      - isp-network

  # ── FreeRADIUS ────────────────────────────────────────────────────────────────
  freeradius:
    image: freeradius/freeradius-server:latest
    restart: unless-stopped
    volumes:
      - ./config/freeradius:/etc/freeradius/3.0
    environment:
      DB_HOST:     postgres
      DB_NAME:     isp_db
      DB_USER:     isp_user
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - isp-network

  # ── WireGuard VPN ─────────────────────────────────────────────────────────────
  wireguard:
    image: linuxserver/wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID:            1000
      PGID:            1000
      TZ:              Africa/Kampala
      SERVERURL:       ${WG_SERVER_URL:-139.84.247.205}
      SERVERPORT:      51820
      PEERS:           0
      PEERDNS:         auto
      INTERNAL_SUBNET: 10.99.0.0/24
      ALLOWEDIPS:      0.0.0.0/0
    volumes:
      - ./config/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - isp-network

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - isp-network

volumes:
  pgdata:
  redisdata:

networks:
  isp-network:
    driver: bridge
