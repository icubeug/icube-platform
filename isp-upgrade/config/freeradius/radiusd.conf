##
## radiusd.conf — iCube Platform FreeRADIUS 3.x
## PostgreSQL backend, RADIUS dynamic authorization on 3799
##

prefix       = /usr
exec_prefix  = /usr
sysconfdir   = /etc/freeradius/3.0
localstatedir = /var
sbindir      = ${exec_prefix}/sbin
logdir       = /var/log/freeradius
raddbdir     = /etc/freeradius/3.0
radacctdir   = ${logdir}/radacct
confdir      = ${raddbdir}
modconfdir   = ${confdir}/mods-config
certdir      = ${confdir}/certs
cadir        = ${confdir}/certs
run_dir      = ${localstatedir}/run/freeradius

db_dir       = ${raddbdir}

libdir       = /usr/lib/freeradius

pidfile      = ${run_dir}/radiusd.pid

correct_escapes = true

max_request_time    = 30
cleanup_delay       = 5
max_requests        = 1024
hostname_lookups    = no

log {
  destination  = files
  colourise    = yes
  file         = ${logdir}/radius.log
  syslog_facility = daemon
  stripped_names = no
  auth         = yes
  auth_badpass = yes
  auth_goodpass = no
  msg_goodpass = ""
  msg_badpass  = ""
}

checkrad = ${sbindir}/checkrad

security {
  user  = freerad
  group = freerad
  allow_core_dumps = no
  max_attributes = 200
  reject_delay   = 1
  status_server  = yes
}

# Dynamic Authorization (CoA / Disconnect-Request from MikroTik)
listen {
  type       = auth
  ipaddr     = *
  port       = 0
  limit {
    max_connections = 16
    lifetime        = 0
    idle_timeout    = 30
  }
}

listen {
  type       = acct
  ipaddr     = *
  port       = 0
  limit {
    max_connections = 16
    lifetime        = 0
    idle_timeout    = 30
  }
}

# RADIUS Dynamic Authorization — port 3799 (for Disconnect-Message from MikroTik)
listen {
  type       = control
  socket     = ${run_dir}/radiusd.sock
  mode       = rw
  peercred   = yes
}

listen {
  type       = auth+acct
  ipaddr     = *
  port       = 3799
}

thread pool {
  num_servers         = 5
  min_spare_servers   = 3
  max_spare_servers   = 10
  max_servers         = 32
  max_requests_per_server = 0
  auto_limit_acct     = no
}

modules {
  $INCLUDE mods-enabled/
}

instantiate {
}

policy {
  $INCLUDE policy.d/
}

$INCLUDE sites-enabled/
