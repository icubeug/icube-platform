##
## clients.conf — iCube Platform FreeRADIUS clients
## Routers connect via WireGuard VPN (10.99.0.0/24 subnet)
## Each router's per-router secret is stored in the nas table and loaded dynamically.
##

# Dynamic clients — loaded from the 'nas' table in PostgreSQL.
# The sql module must be loaded and clients_query must be configured.
# See mods-enabled/sql for the clients_query setting.

# Allow all connections from the WireGuard VPN subnet.
# Per-router secrets are enforced via the nas table (read by sql module).
client vpn_subnet {
  ipaddr  = 10.99.0.0/24
  secret  = icube-default-radius-secret
  shortname = wireguard-vpn-pool
  nastype = other
}

# Allow localhost for testing / health checks
client localhost {
  ipaddr  = 127.0.0.1
  secret  = testing123
  shortname = localhost
  nastype = other
}

# Allow the Docker internal network (api container → freeradius)
client docker_internal {
  ipaddr  = 172.16.0.0/12
  secret  = icube-default-radius-secret
  shortname = docker-internal
  nastype = other
}
